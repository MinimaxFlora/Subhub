# Kejizero订阅转换 - 单容器进程管理
[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

# ---- subconverter 后端 ----
[program:subconverter]
command=/usr/bin/subconverter
directory=/base
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ---- 短链服务 ----
[program:shortlink]
command=python3 /app/shortlink/server.py
directory=/app/shortlink
autorestart=true
environment=BASE_URL="%(ENV_SHORTLINK_URL)s",DB_PATH="/data/urls.db",HTTP_PORT="7999"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ---- Caddy 网关 ----
[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
