# ============================================================
# Kejizero订阅转换 - 单镜像一键部署
#
# 一个镜像 zhaoweiwen123/subhub 包含全部服务：
#   前端(Vue) + 后端(subconverter) + 短链 + Caddy
#
# 三个域名通过 environment 传入（不填默认本机 localhost）：
#   FRONTEND_DOMAIN  前端域名   默认 localhost
#   BACKEND_DOMAIN   后端域名   默认 localhost
#   SHORTLINK_DOMAIN 短链域名   默认 localhost
#
# 本机模式：docker compose up -d --build
#   前端 http://localhost | 后端 http://localhost:25500 | 短链 http://localhost:7999
#
# 公网模式：填三个域名 -> Caddy 自动反代 + 自动 HTTPS 证书
# ============================================================

services:
  subhub:
    build: .
    image: zhaoweiwen123/subhub
    container_name: kejizero-subhub
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 三个域名（不填默认本机 localhost）
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-localhost}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-localhost}
      SHORTLINK_DOMAIN: ${SHORTLINK_DOMAIN:-localhost}
      # 前端调用的后端/短链完整地址（不填自动推导）
      BACKEND_URL: ${BACKEND_URL:-}
      SHORTLINK_URL: ${SHORTLINK_URL:-}
      # TLS 证书邮箱
      ACME_EMAIL: ${ACME_EMAIL:-admin@kejizero.xyz}
    volumes:
      - subhub_data:/data   # 短链 SQLite 数据持久化

volumes:
  subhub_data:
