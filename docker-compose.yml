# ============================================================
# Kejizero订阅转换 - 一键部署全家桶
# 用法：
#   1. cp .env.example .env
#   2. 编辑 .env 设置三个域名（前端/后端/短链）
#   3. docker compose up -d --build
# 效果：Caddy 自动反代三个域名 + 自动申请 HTTPS 证书
# ============================================================

services:
  # ---- 网关：自动反代 + HTTPS 证书 ----
  caddy:
    image: caddy:2-alpine
    container_name: kejizero-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
      SHORTLINK_DOMAIN: ${SHORTLINK_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@kejizero.xyz}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - shortlink

  # ---- 前端：Kejizero订阅转换 ----
  frontend:
    build:
      context: ./frontend
      args:
        # 构建时注入后端/短链域名到前端
        VUE_APP_SUBCONVERTER_DEFAULT_BACKEND: https://${BACKEND_DOMAIN}
        VUE_APP_MYURLS_DEFAULT_BACKEND: https://${SHORTLINK_DOMAIN}
    container_name: kejizero-frontend
    restart: always
    expose:
      - "80"

  # ---- 后端：subconverter ----
  backend:
    build: ./backend
    container_name: kejizero-backend
    restart: always
    expose:
      - "25500"

  # ---- 短链服务 ----
  shortlink:
    build: ./shortlink
    container_name: kejizero-shortlink
    restart: always
    environment:
      BASE_URL: https://${SHORTLINK_DOMAIN}
      DB_PATH: /data/urls.db
    volumes:
      - shortlink_data:/data
    expose:
      - "7999"

volumes:
  caddy_data:
  caddy_config:
  shortlink_data:
