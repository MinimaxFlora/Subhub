name: Build & Push Docker Image

on:
  # 手动触发构建（不自动构建）
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read domains from .env.example
        id: domains
        run: |
          # 从 .env.example 读取域名（与 docker-compose environment 保持一致）
          # 未填(空) = 本机模式：前端默认后端/短链用本机端口
          BACKEND_DOMAIN=$(grep -E '^BACKEND_DOMAIN=' .env.example | head -1 | cut -d= -f2 | tr -d ' \r')
          SHORTLINK_DOMAIN=$(grep -E '^SHORTLINK_DOMAIN=' .env.example | head -1 | cut -d= -f2 | tr -d ' \r')
          if [ -n "$BACKEND_DOMAIN" ]; then
            echo "BACKEND_URL=https://$BACKEND_DOMAIN" >> $GITHUB_ENV
          else
            echo "BACKEND_URL=http://localhost:25500" >> $GITHUB_ENV
          fi
          if [ -n "$SHORTLINK_DOMAIN" ]; then
            echo "SHORTLINK_URL=https://$SHORTLINK_DOMAIN" >> $GITHUB_ENV
          else
            echo "SHORTLINK_URL=http://localhost:7999" >> $GITHUB_ENV
          fi
          echo "构建模式: $([ -n "$BACKEND_DOMAIN" ] && echo 域名模式 || echo 本机模式)"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push single image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            zhaoweiwen123/subhub:latest
          build-args: |
            VUE_APP_SUBCONVERTER_DEFAULT_BACKEND=${{ env.BACKEND_URL }}
            VUE_APP_MYURLS_DEFAULT_BACKEND=${{ env.SHORTLINK_URL }}

      - name: Output image
        run: |
          echo "已推送镜像 (Docker Hub): zhaoweiwen123/subhub:latest"
