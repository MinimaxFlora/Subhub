name: Build & Push Docker Images

on:
  # 手动触发：可自定义三个域名（不填则使用 .env 默认值）
  workflow_dispatch:
    inputs:
      frontend_domain:
        description: '前端域名 (如 sub.example.com)'
        required: false
        default: ''
      backend_domain:
        description: '后端域名 (如 api.example.com)'
        required: false
        default: ''
      shortlink_domain:
        description: '短链域名 (如 short.example.com)'
        required: false
        default: ''
  # 推送 master 分支时自动构建
  push:
    branches: [master]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'shortlink/**'
      - 'docker-compose.yml'
      - '.env.example'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set domain env vars
        id: domains
        run: |
          FRONTEND_DOMAIN="${{ github.event.inputs.frontend_domain }}"
          BACKEND_DOMAIN="${{ github.event.inputs.backend_domain }}"
          SHORTLINK_DOMAIN="${{ github.event.inputs.shortlink_domain }}"
          # 未输入时从 .env.example 读取默认值
          [ -z "$FRONTEND_DOMAIN" ] && FRONTEND_DOMAIN=$(grep FRONTEND_DOMAIN .env.example | cut -d= -f2 | tr -d ' ')
          [ -z "$BACKEND_DOMAIN" ] && BACKEND_DOMAIN=$(grep BACKEND_DOMAIN .env.example | cut -d= -f2 | tr -d ' ')
          [ -z "$SHORTLINK_DOMAIN" ] && SHORTLINK_DOMAIN=$(grep SHORTLINK_DOMAIN .env.example | cut -d= -f2 | tr -d ' ')
          echo "FRONTEND_DOMAIN=$FRONTEND_DOMAIN" >> $GITHUB_ENV
          echo "BACKEND_DOMAIN=$BACKEND_DOMAIN" >> $GITHUB_ENV
          echo "SHORTLINK_DOMAIN=$SHORTLINK_DOMAIN" >> $GITHUB_ENV
          echo "本次构建域名: 前端=$FRONTEND_DOMAIN 后端=$BACKEND_DOMAIN 短链=$SHORTLINK_DOMAIN"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images (docker compose)
        run: |
          docker compose build

      - name: Tag & Push images
        run: |
          IMG_PREFIX="zhaoweiwen123/kejizero"
          TAG="${{ github.sha }}"
          docker tag kejizero-frontend  "${IMG_PREFIX}-frontend:${TAG}"
          docker tag kejizero-frontend  "${IMG_PREFIX}-frontend:latest"
          docker tag kejizero-backend   "${IMG_PREFIX}-backend:${TAG}"
          docker tag kejizero-backend   "${IMG_PREFIX}-backend:latest"
          docker tag kejizero-shortlink "${IMG_PREFIX}-shortlink:${TAG}"
          docker tag kejizero-shortlink "${IMG_PREFIX}-shortlink:latest"
          docker push "${IMG_PREFIX}-frontend:${TAG}"
          docker push "${IMG_PREFIX}-frontend:latest"
          docker push "${IMG_PREFIX}-backend:${TAG}"
          docker push "${IMG_PREFIX}-backend:latest"
          docker push "${IMG_PREFIX}-shortlink:${TAG}"
          docker push "${IMG_PREFIX}-shortlink:latest"

      - name: Output image list
        run: |
          echo "已推送镜像 (Docker Hub: zhaoweiwen123):"
          echo "  kejizero-frontend :${{ github.sha }} / latest"
          echo "  kejizero-backend  :${{ github.sha }} / latest"
          echo "  kejizero-shortlink:${{ github.sha }} / latest"
